name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Create GitHub Pages entry point
        shell: bash
        run: |
          set -e
          ENTRY="$(find .output/public/assets -maxdepth 1 -type f -name 'index-*.js' | head -n 1)"
          CSS="$(find .output/public/assets -maxdepth 1 -type f -name 'styles-*.css' | head -n 1)"
          test -n "$ENTRY"
          test -n "$CSS"
          ENTRY="${ENTRY#./.output/public/}"
          CSS="${CSS#./.output/public/}"
          cat > .output/public/index.html <<EOF
          <!doctype html>
          <html lang="fr">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <meta name="theme-color" content="#0d1b2a">
              <title>BREIZH FOOD</title>
              <link rel="icon" href="./favicon.svg">
              <link rel="stylesheet" href="./$CSS">
            </head>
            <body>
              <script type="module" src="./$ENTRY"></script>
            </body>
          </html>
          EOF
          cp .output/public/index.html .output/public/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./.output/public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
